# Pre-commit hooks: run on every `git commit`.
# Install once with: pre-commit install
# Run on all files (e.g. on first install): pre-commit run --all-files

repos:
  # Standard hygiene: whitespace, EOF, conflict markers, syntax of YAML/TOML.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # --unsafe so compose-spec custom tags (!reset, !override) parse cleanly.
        args: ["--unsafe"]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]

  # Ruff: fast Python linter + formatter. Auto-fixes safe issues.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # basedpyright: stricter pyright fork. Required for the project's
  # `reportAny` / `reportExplicitAny` enforcement (vanilla pyright silently
  # ignores those settings). Runs via the project's venv so third-party
  # imports (anthropic, structlog, mss, ...) resolve.
  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright
        # Explicit scope: the hook ignores pyproject's `include` when given
        # filenames, so pass the AI-agent dirs ourselves.
        # Mirrors the CI scope in .github/workflows/ci.yml — keep them in sync.
        # `arena` and `data` are first-party packages too: omitting them silently
        # skipped the broker SSE handler, `/metrics` dispatch, and DB persisters.
        entry: venv/bin/basedpyright gameplay_agent autoresearch evaluation server arena data
        language: system
        types: [python]
        pass_filenames: false

      # Mirrors the CI `uv lock --locked` check: fails if pyproject.toml and
      # uv.lock are out of sync. Triggered only when one of those files is
      # staged — no overhead on commits that don't touch dependencies.
      - id: uv-lock-locked
        name: uv lock --locked (pyproject/uv.lock consistency)
        entry: uv lock --locked
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
