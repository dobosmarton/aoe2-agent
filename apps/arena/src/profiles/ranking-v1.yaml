turns: 60
rounds: 5

# Bradley-Terry ranking config: K rounds x M scenarios x N profiles.
# Temperature=0.5 introduces LLM sampling variance so rounds are
# non-degenerate. Scenarios are sourced from arena.scenarios.DEFAULT_SCENARIOS
# when the `scenarios` list is empty.
profiles:
  - name: bare
    model: gpt-5.6-luna
    temperature: 0.5
    prompt_variant: bare

  - name: strategy
    model: gpt-5.6-luna
    temperature: 0.5
    prompt_variant: strategy
