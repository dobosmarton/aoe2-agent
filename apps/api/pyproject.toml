[project]
name = "arena-web"
version = "0.1.0"
description = "Arena replay/fork web server — FastAPI + SSE backend."
requires-python = ">=3.11"
dependencies = [
    "core",
    "evaluation",
    "gameplay-agent",
    "arena",
    "duckdb>=1.0.0",
    "fastapi>=0.115.0",
    "pydantic>=2.5.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
aoe2-arena-web = "arena_web.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "arena_web" = "src" }
packages = ["arena_web"]
