# Dark Age rules — exported from reactive.py, 2026-08-17.
#
# Behaviour must match `reactive.decide()`. The 62 tests in
# tests/test_reactive.py are the proof (ADAPTIVE-AGENT-PLAN.md 1.5).
#
# `weight` reproduces the group order in `reactive.decide`:
#   age up 100 > house 90 > queue 80 > mill 72 > camp 70 > mining camp 60 > idle 40
# Hand-seeded. Phase 6.1 replaces them with ablation results.
#
# The house rule is age-agnostic and lives here because the Dark Age is where it
# first bites; the registry is one flat list, so the file split is for reading.
#
# See ../findings.md for the run review behind each `provenance` tag. Per plan
# 0.2 a seed rule is exempt from retirement until it has been ablated once.
#
# `max_state_age_ms` is provisional at 30000 on every rule. The declared
# 2000-6000 budgets were seeded for the act loop; today's coupled tick spans
# OCR and detection, so enforcing them would skip the rule, not the stale
# reading. Real numbers once the act loop lands.

- id: age_up_feudal
  when: >
    age == 'Dark Age' and food >= 500
    and 'mill' in buildings_seen and 'lumber_camp' in buildings_seen
  then:
    - {type: press, key: h, intent: Select TC (age up)}
    - {type: press, key: z, intent: Research Feudal Age (reactive)}
  weight: 100
  cost: {food: 500}
  max_state_age_ms: 30000
  provenance: seed/F-26+F-27+F-32
  enabled: true
  stats: {fired: 0, ablation_delta: null, ablation_ci: null}
  # Runs before the villager queue so the 500 food buys the age, not a villager.
  # `h` first clears any open build menu, so `z` cannot land in the econ menu
  # where Z is Outpost (F-27). NEVER prefix with escape — that opens the game
  # menu when nothing needs cancelling (run 8, F-32).
  # Gated on the two-building requirement so the press fires once when it can
  # succeed; run 6 spammed 14 no-ops against a greyed button (F-26).
  # Wants the tightest freshness budget of the 8 — a stale food reading here
  # spends the wrong turn. 2000 ms returns once the act loop lands.

- id: house_when_headroom_gone
  when: population_cap < 200 and (population_cap - population) <= 2
  then:
    type: build
    building_key: q
    intent: "Build house (headroom {population}/{population_cap})"
  weight: 90
  cost: {wood: 25}
  max_state_age_ms: 30000
  provenance: seed/F-45
  enabled: true
  stats: {fired: 0, ablation_delta: null, ablation_ci: null}
  # Runs before the queue because "housed" IS a blocked queue.
  # Trigger stays at 2, inside the executor's _HOUSE_HEADROOM_MAX allow band of
  # 4, or every emit would be rejected as ample headroom (drift test T-515).
  # Do NOT widen: the 2026-07-11 run built houses at 15+ headroom, 125 wood,
  # while the first farm starved for 60 (F-45).

- id: queue_villager_dark
  when: age == 'Dark Age' and villagers_ordered < 30 and villagers_ordered < population_cap
  then: {type: queue_villager, intent: Queue villager (reactive)}
  weight: 80
  cost: {food: 50}
  max_state_age_ms: 30000
  provenance: seed/F-38+F-16+F-11
  enabled: true
  stats: {fired: 0, ablation_delta: null, ablation_ci: null}
  # Gate on ORDERS, never on delivered population. Orders lead the HUD by the TC
  # queue depth (~25 s per villager against a ~10 s turn); a population brake
  # pressed q 36 times at pop <= 15 and delivered 40 villagers whose food cost
  # WAS the Feudal bank (run 11, F-38).
  # 30 is a user directive: enough economy to bank 500 food. Every order past it
  # is the Feudal bank being spent (F-11). The queue must STOP or 500 never
  # accumulates at 50 food a time (F-16).

- id: feudal_prep_mill
  when: age == 'Dark Age' and population >= 12 and 'mill' not in buildings_seen
  then:
    type: build
    building_key: w
    intent: "Build mill (Feudal prerequisite + farm/food unlock)"
  weight: 72
  cost: {wood: 100}
  bank_wood: true
  max_state_age_ms: 30000
  provenance: seed/F-41+F-26
  enabled: true
  stats: {fired: 0, ablation_delta: null, ablation_ci: null}
  # The mill LEADS the lumber camp: it is both a Feudal prerequisite and the
  # farm unlock, so the whole late-Dark-Age food engine hangs off it.
  # Run 12 starved with the executor down 85 of 95 turns, because only the LLM
  # had ever built a mill (F-41). This rule is why the fast tier can feed itself.
  # One build per turn — the executor's unique-building gate rejects re-emits.

- id: feudal_prep_lumber_camp
  when: >
    age == 'Dark Age' and population >= 12
    and 'mill' in buildings_seen and 'lumber_camp' not in buildings_seen
  then:
    type: build
    building_key: r
    intent: "Build lumber camp (Feudal prerequisite + wood income)"
  weight: 70
  cost: {wood: 100}
  bank_wood: true
  max_state_age_ms: 30000
  provenance: seed/F-26+F-34
  enabled: true
  stats: {fired: 0, ablation_delta: null, ablation_ci: null}
  # The second qualifying building. Houses do NOT count (F-26).
  # `'mill' in buildings_seen` makes this EXCLUSIVE with feudal_prep_mill, which
  # is how reactive.py's if/elif behaved: one prep build per turn, mill first.
  # Dropping that clause emits both when neither stands.

# Idle dispatch (weight 40) is NOT a rule. It reads the entity list, not the
# state, so it cannot be declarative — see policy/idle.py and plan 1.3.1.
# The engine appends its output after every rule, which is where reactive.py
# put it. Its constants (batch 3/6, distrust streak 4, gather ratios, famine
# overrides) live in allocation.yaml and idle.py.
