[project]
name = "data"
version = "0.1.0"
description = "AoE2 game-knowledge SQLite database + accessors."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "data" = "src" }
packages = ["data"]

[tool.setuptools.package-data]
data = ["aoe2.db", "knowledge_base/**/*"]
