name: Deploy landing to Vercel

on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "docs/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    paths:
      - "apps/landing/**"
      - "docs/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `bun install` from repo root resolves the workspace lockfile and
      # hoists deps for every workspace member (apps/landing + apps/dashboard)
      # into the root node_modules/.
      - name: Install dependencies (workspace, frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium (for rehype-mermaid)
        working-directory: apps/landing
        run: bunx playwright install --with-deps chromium

      - name: Build site (Astro + Pagefind)
        working-directory: apps/landing
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://aoe2.martondobos.com' }}
        run: bun run build

      # Assemble Vercel's Build Output API folder from the already-built dist/.
      # A pure-static site needs only static/ + a minimal config.json — Vercel
      # never runs a build, so the headless-Chromium mermaid step (which only
      # works on this Ubuntu runner) never has to run in Vercel's sandbox.
      - name: Assemble Vercel prebuilt output (Build Output API)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/landing
        run: |
          mkdir -p .vercel/output
          mv dist .vercel/output/static
          echo '{"version":3}' > .vercel/output/config.json

      - name: Deploy prebuilt to Vercel (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/landing
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
