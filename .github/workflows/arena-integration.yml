name: Arena Integration

# Opt-in / scheduled integration tests for the Synthetic Arena stack.
#
# Triggers:
#   * PRs labeled `arena-ci` — for verifying compose / lockfile / infra changes.
#   * Nightly cron — catches upstream image drift Renovate hasn't yet bumped.
#   * Manual dispatch — for ad-hoc smoke testing.
#
# Phase 0 scope: just "stack comes up healthy within ~90s on tmpfs volumes".
# Later phases extend this file with synthetic smoke runs + DuckDB + Langfuse
# trace assertions (per docs/design/synthetic-arena-analysis.md §"Verification").
#
# Kept OUT of the fast PR CI (`ci.yml`) so day-to-day PR feedback stays under
# ~3 min and doesn't pull multi-hundred-MB images on every push.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # 03:17 UTC nightly — staggered off the hour to dodge GitHub-runner contention.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arena-stack-smoke:
    # Skip on PRs that don't carry the `arena-ci` label. Scheduled + manual
    # runs always execute (github.event_name != 'pull_request').
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'arena-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Write throwaway secrets for compose
        # Healthchecks need non-empty env vars but no actual auth is exercised
        # here — Phase 0 only asserts "containers go Healthy". Real secret
        # rotation happens out-of-band in production.
        run: |
          {
            echo "ANTHROPIC_API_KEY=ci-not-used"
            echo "LANGFUSE_SALT=$(openssl rand -base64 24)"
            echo "LANGFUSE_NEXTAUTH_SECRET=$(openssl rand -base64 24)"
            echo "LANGFUSE_ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "LANGFUSE_DB_PASSWORD=$(openssl rand -base64 24 | tr -d '=+/' )"
            echo "CLICKHOUSE_PASSWORD=$(openssl rand -base64 24 | tr -d '=+/' )"
            echo "REDIS_PASSWORD=$(openssl rand -base64 24 | tr -d '=+/' )"
            echo "MINIO_ROOT_USER=arena"
            echo "MINIO_ROOT_PASSWORD=$(openssl rand -base64 24 | tr -d '=+/' )"
            echo "OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318"
          } > .env

      - name: Bring up arena stack on tmpfs (CI override)
        # We deliberately do NOT use `compose up --wait`. The otel-collector
        # contrib image is distroless (FROM scratch) so it can't run an
        # in-container healthcheck probe — its healthcheck is intentionally
        # disabled in the base compose. `--wait` errors out the moment any
        # awaited service has no healthcheck, even when every health-checked
        # service is Healthy. We poll from the host in the next step instead.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d

      - name: Wait for healthchecks
        # Poll up to ~240s for every container that *has* a healthcheck to
        # reach `healthy`. Services with no healthcheck (otel-collector) are
        # treated as ready once they're running — the previous `up -d` only
        # returns after compose has started them.
        run: |
          set -o pipefail
          deadline=$((SECONDS + 240))
          while [ $SECONDS -lt $deadline ]; do
            pending=$(docker compose -f docker-compose.yml -f docker-compose.ci.yml ps --format json \
              | jq -r 'select((.Health // "") != "" and .Health != "healthy") | .Service')
            if [ -z "$pending" ]; then
              echo "All health-checked services Healthy."
              exit 0
            fi
            echo "Still waiting on: $(echo "$pending" | tr '\n' ' ')"
            sleep 5
          done
          echo "::error::Timed out after 240s waiting for healthchecks"
          exit 1

      - name: Show container status
        if: always()
        run: |
          set -o pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps
          # `compose ps --format json` emits NDJSON (one object per line) on
          # current Compose — no outer `.[]` needed; jq streams each line.
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps --format json \
            | jq -r '"\(.Service): \(if (.Health // "") == "" then "n/a" else .Health end)"'

      - name: Assert every health-checked service is Healthy
        run: |
          set -o pipefail
          unhealthy=$(docker compose -f docker-compose.yml -f docker-compose.ci.yml ps --format json \
            | jq -r 'select((.Health // "") != "" and .Health != "healthy") | .Service')
          if [ -n "$unhealthy" ]; then
            echo "::error::Unhealthy services: $unhealthy"
            exit 1
          fi
          echo "All health-checked services healthy."

      - name: Set up Python (for broker cross-process test)
        # The fast `ci.yml` runs the broker contract sweep against `fakeredis`;
        # this integration job has a *real* Redis up (with `REDIS_PASSWORD`
        # AUTH) and is the only CI surface where the cross-process test —
        # publisher in OS process A, consumer in OS process B — actually
        # gets to run. Without this step that test auto-skips on every CI run.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install broker test dependencies
        # `dev` is a PEP 735 dependency-group at the workspace root (auto-installed
        # by `uv sync` unless `--no-dev`), not an extra. `broker-redis` is an extra
        # on the `evaluation` package. `--all-extras` traverses every workspace
        # member, matching the fast `ci.yml` install step.
        run: uv sync --all-extras

      - name: Run cross-process Redis broker test
        # Source .env so REDIS_PASSWORD is in scope, then point pytest at the
        # compose Redis (port 6379 published to host). Test auto-skips if
        # Redis is unreachable, so a failure here means a real regression.
        run: |
          set -a; . ./.env; set +a
          export REDIS_URL="redis://:${REDIS_PASSWORD}@localhost:6379/0"
          uv run pytest tests/test_redis_broker_cross_process.py -v

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
