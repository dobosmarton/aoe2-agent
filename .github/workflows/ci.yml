name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Verify all docker-compose images are digest-pinned
        run: |
          if grep -rE '^\s*image:' docker-compose*.yml | grep -v '@sha256:'; then
            echo "::error::Found docker-compose image lines without @sha256: digests"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Verify uv.lock is up to date
        run: uv lock --locked

      - name: Sync workspace (all members + dev tools)
        # `uv sync` installs every package under packages/* in editable mode
        # plus the dev dependency-group (basedpyright, pytest, ruff,
        # fakeredis, hypothesis, ...). `--all-extras` pulls package-level
        # optional deps too (broker-redis, server, coreml, training, labeling).
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: basedpyright type-check
        # `[tool.pyright]` in the root pyproject scopes the check to
        # packages/*/src + tests.
        run: uv run basedpyright

      - name: Pytest
        run: uv run pytest -q

  ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
