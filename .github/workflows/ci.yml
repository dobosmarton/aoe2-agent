name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a branch is force-pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            gameplay_agent/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Runtime deps so pyright can resolve imports (anthropic, structlog, ...).
          pip install -r gameplay_agent/requirements.txt
          # Dev tooling.
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pyright type-check
        # Scope-explicit because the bundled pyproject `include` only kicks in
        # when pyright is invoked with no path args.
        run: pyright gameplay_agent autoresearch evaluation server

      - name: Pytest
        run: pytest -q
