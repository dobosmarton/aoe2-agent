name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a branch is force-pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project + dev + server extras
        # Single source of truth: pyproject.toml [project.dependencies] +
        # [project.optional-dependencies]. coremltools is a macOS-only extra
        # that we deliberately skip on Linux CI.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pyright type-check
        # Scope-explicit because the bundled pyproject `include` only kicks in
        # when pyright is invoked with no path args.
        run: pyright gameplay_agent autoresearch evaluation server

      - name: Pytest
        run: pytest -q
