# OpenTelemetry Collector config for the Synthetic Arena.
#
# The agent processes (native, not containerized) emit OTLP/HTTP traces to
# http://localhost:4318 (forwarded from this container's :4318 in compose).
# The collector batches and forwards them to Langfuse's OTLP endpoint.
#
# Healthcheck probe lives on :13133 (health_check extension).

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  # Phase 0: just emit to stdout. Wiring traces to Langfuse's OTLP receiver
  # happens in phase 4 when the event log lands and the agent starts emitting
  # OTLP spans. Until then, the collector existing & healthy is the bar.
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
