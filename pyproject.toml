# Workspace root — not a Python package itself; declares the workspace members
# and holds shared tooling config (ruff, basedpyright, coverage) that every
# member inherits.
#
# Install everything editable in one shot:
#     uv sync                        # all members + dev tools
#     uv sync --no-dev               # all members, no dev tools
#
# Layout: apps/* are deployable units (CLIs + long-running services);
# packages/* are reusable libraries imported by apps. uv resolves workspace
# members by package name (not path), so the [tool.uv.sources] mapping below
# does not change when a member moves between apps/ and packages/.
#
# Run a specific package's entry point:
#     uv run --package gameplay-agent aoe2-agent        # apps/agent/
#     uv run --package arena aoe2-arena race            # apps/arena/
#     uv run --package arena-web aoe2-arena-web         # apps/api/
#     uv run --package detection-server aoe2-server     # apps/detection-server/

[tool.uv.workspace]
members = ["apps/*", "packages/*"]
# JS-only apps live alongside Python ones under apps/ — exclude them so uv
# doesn't expect a pyproject.toml in each. The bun workspace (root
# package.json) owns these instead.
exclude = ["apps/dashboard", "apps/landing"]

# Wire every workspace member to its sibling source. Without these `[tool.uv.sources]`
# entries, uv would try to resolve the package names from PyPI.
[tool.uv.sources]
core             = { workspace = true }
detection        = { workspace = true }
evaluation       = { workspace = true }
gameplay-agent   = { workspace = true }
arena            = { workspace = true }
arena-web        = { workspace = true }
detection-server = { workspace = true }
training-api     = { workspace = true }
autoresearch     = { workspace = true }
data             = { workspace = true }

# Dev tooling — installed alongside every member. PEP 735 dependency-groups
# are the modern replacement for the old `[project.optional-dependencies] dev`
# pattern; uv installs them on `uv sync` (unless `--no-dev`).
[dependency-groups]
dev = [
    "basedpyright>=1.39.0",
    "fakeredis>=2.20",
    "hypothesis>=6.0",
    "pre-commit>=4.0.0",
    "pytest>=9.0.0",
    "pytest-cov>=5.0.0",
    "redis>=5.0",
    "ruff>=0.15.0",
]


# ---------------------------------------------------------------------------
# Ruff — applies repo-wide via `[tool.ruff]` here.
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100

# Lint all first-party source under packages/ + tests. Scratch / vendored /
# non-source dirs stay excluded.
extend-exclude = [
    "experiments",
    "logs",
    "tmp",
    "memories",
    "game_graphics",
    "apps/dashboard",              # Vite/TypeScript frontend, not Python
    "apps/landing",                # Astro/TypeScript site, not Python
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "PTH", # flake8-use-pathlib
    "DTZ", # flake8-datetimez
    "RET", # flake8-return
    "TCH", # flake8-type-checking
    "C4",  # flake8-comprehensions
    "ANN", # flake8-annotations
    "PGH", # pygrep-hooks
]
ignore = [
    "E501",   # line-too-long handled by formatter
    "B008",   # function-call-in-default-argument: FastAPI Depends(), etc.
    "SIM108", # use ternary: not always more readable
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


# ---------------------------------------------------------------------------
# basedpyright — applies repo-wide. Discovers each package via the workspace
# install (uv puts editable shims under .venv/lib/.../site-packages).
# ---------------------------------------------------------------------------

[tool.pyright]
# Scope to first-party source only — tests were never typechecked under
# the previous setup either (matches the pre-workspace CI scope).
include = ["apps/*/src", "packages/*/src"]
exclude = [
    ".venv",
    "**/__pycache__",
    "experiments",
    "tmp",
    "logs",
    "memories",
    "apps/dashboard",
    "apps/landing",
]
typeCheckingMode = "basic"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportMissingImports = "warning"
reportMissingModuleSource = "none"
reportExplicitAny = "error"
reportAny = "error"


# ---------------------------------------------------------------------------
# Coverage (pytest-cov)
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["apps", "packages"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    ".venv/*",
    "experiments/*",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]


# ---------------------------------------------------------------------------
# pytest — workspace-wide test discovery.
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = []
