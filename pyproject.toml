[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"


# ---------------------------------------------------------------------------
# Project metadata (PEP 621)
# ---------------------------------------------------------------------------
# Single source of truth for dependencies and scripts. Install with:
#   pip install -e .                  # core agent (Mac dev)
#   pip install -e ".[server]"        # also install the detection server
#   pip install -e ".[dev]"           # core + dev tooling (ruff, pytest, ...)
#   pip install -e ".[server,dev]"    # everything for full local work
#   pip install -e ".[coreml]"        # macOS-only CoreML inference
[project]
name = "aoe2-agent"
version = "0.1.0"
description = "AoE2 LLM Arena — gameplay agent + detection server + evaluation framework"
requires-python = ">=3.11"
authors = [{ name = "Marton Dobos" }]
readme = { file = "README.md", content-type = "text/markdown" }

# Core runtime — used by gameplay_agent and indirectly by tests.
# Mirrors gameplay_agent/requirements.txt; the .txt file is kept as a
# convenience alias but `pip install -e .` is the source of truth.
dependencies = [
    "anthropic>=0.84.0",
    "colorama>=0.4.6",
    "duckdb>=1.0.0",
    "httpx>=0.27.0",
    "mss>=9.0.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.17.0",
    "Pillow>=10.0.0",
    "pyautogui>=0.9.54",
    "pydantic>=2.5.0",
    "pygetwindow>=0.0.9",
    "python-multipart>=0.0.7",
    "pyyaml>=6.0",
    "scipy>=1.11.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
dev = [
    "ruff>=0.15.0",
    "pytest>=9.0.0",
    "pytest-cov>=5.0.0",
    "pyright>=1.1.400",
    "pre-commit>=4.0.0",
]
# macOS-only — install separately when running CoreML inference.
coreml = [
    "coremltools>=8.0",
]

[project.scripts]
aoe2-agent = "gameplay_agent.main:main"
aoe2-server = "server.app:main"

[tool.setuptools.packages.find]
include = [
    "gameplay_agent*",
    "autoresearch*",
    "evaluation*",
    "server*",
    "detection*",
    "data*",
]
exclude = ["tests*", "experiments*", "venv*", "memories*", "logs*", "tmp*"]


# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100

# Skip vendored / data / non-source dirs. Ruff's defaults already exclude
# venv, build, dist, etc., but spell out the project-specific ones.
extend-exclude = [
    "experiments",
    "data",
    "logs",
    "tmp",
    "memories",
    "game_graphics",
]

[tool.ruff.lint]
# Active rule set. Rules that have been baselined and triaged are below;
# deliberately deferred rules + the reason are listed in the comment block
# after `select`.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names)
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade (modern Python idioms)
    "B",   # flake8-bugbear (likely bugs)
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "PTH", # flake8-use-pathlib (prefer Path over os.path/builtin open)
    "DTZ", # flake8-datetimez (require explicit tz on datetime calls)
    "RET", # flake8-return (drop superfluous else-after-return / build-then-return)
    "TCH", # flake8-type-checking (push type-only imports under TYPE_CHECKING)
    "C4",  # flake8-comprehensions (idiomatic comprehensions / dict construction)
    "ANN", # flake8-annotations (require type hints on AI-agent code)
    "PGH", # pygrep-hooks: forbid blanket `# type: ignore` without a code; flag eval/exec usage
]
# Rules audited and intentionally NOT enabled (re-evaluate when the
# corresponding baseline shrinks or a contributor wants to do the cleanup):
#   ANN   — 249 missing-annotation errors. Worth attacking once core
#           modules have full type hints; doing it as a global pass would
#           churn 30+ files for low marginal value.
#   BLE001 — 41 broad `except Exception:` sites, all legitimate boundary
#           catches (anthropic SDK, optional-resource init, harness
#           tolerance). See note in `ignore` below.
#   S     — 348 hits dominated by S101 (267 `assert` in tests; the standard
#           way to write pytest assertions) and S311 (67 random.*; used for
#           game-variety, not crypto). Real signal would be drowned.
#   N     — naming. Several established names (e.g. `_DETECTED_ENTITIES`)
#           would flip on enabling.
#   PL    — pylint-style rules; ~1k findings, mostly stylistic.
ignore = [
    "E501",   # line-too-long: ruff format handles formatting; long literals are fine
    "B008",   # function-call-in-default-argument: common with FastAPI Depends() etc.
    "SIM108", # use ternary: not always more readable
    # ANN401 (`Any` in type annotations) IS enforced. The codebase aims to have
    # zero `Any` annotations. SDK boundaries that genuinely need to escape the
    # type system use `# pyright: ignore[reportArgumentType]` per-line instead
    # of the previous `cast(Any, ...)` pattern.
    # BLE001 (blind-except) deliberately NOT enabled. Audited 2026-05: all 41
    # `except Exception:` sites are legitimate boundary catches (anthropic API
    # calls, optional-resource init, scenario-harness tolerance, file-parser
    # robustness, Tkinter overlay, conftest GUI-import shim). Narrowing them
    # would mean every new exception type from a third-party SDK becomes an
    # unhandled crash. Re-run `ruff check . --select BLE001` for an ad-hoc
    # audit before adding new broad catches.
]

[tool.ruff.lint.per-file-ignores]
# Tests don't need annotations — pytest doesn't care about test return types,
# and `dataclass` test fixtures get annotation-free defaults.
"tests/**" = ["ANN"]
# detection/ is computer-vision / ML code with heavy numpy.ndarray and
# ultralytics types. Annotating thoroughly requires understanding the
# third-party shape contracts; deferred until that work is scoped.
"detection/**" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


# ---------------------------------------------------------------------------
# Pyright — static type checker
# ---------------------------------------------------------------------------
# Scoped to the AI agent code. detection/ is computer-vision/ML and uses
# numpy/PIL shapes that grumble loudly under static checking; revisit later.
[tool.pyright]
include = [
    "gameplay_agent",
    "autoresearch",
    "evaluation",
    "server",
]
exclude = [
    "venv",
    "**/__pycache__",
    "experiments",
    "tmp",
    "logs",
    "memories",
    "data",
]
# No venv= config: pre-commit runs `venv/bin/pyright` directly via the
# `language: system` hook, which finds its own site-packages. CI runs
# pyright from the system Python after `pip install -r ...`.
typeCheckingMode = "basic"
pythonVersion = "3.11"
# Treat third-party packages without stubs as untyped rather than failing.
reportMissingTypeStubs = false
reportMissingImports = "warning"
# Enforce no `Any` annotations and no `cast(Any, ...)` escape hatches.
# SDK boundaries that genuinely need to escape the type system use
# `# pyright: ignore[reportArgumentType]` per-line instead.
reportExplicitAny = "error"
reportAny = "error"

# Per-directory strict mode via executionEnvironments. Each scoped dir
# runs its own files under strict rules but treats dependencies as
# `basic` (avoids strict-checking transitively-imported third-party
# code). After the ANN pass, all four AI-agent dirs pass strict
# cleanly with 0 errors.
[[tool.pyright.executionEnvironments]]
root = "evaluation"
typeCheckingMode = "strict"
# Sibling packages live at the project root; without extraPaths the
# strict env scopes its resolver to `evaluation/` only and can't find
# `gameplay_agent`, `autoresearch`, etc.
extraPaths = ["."]

[[tool.pyright.executionEnvironments]]
root = "autoresearch"
typeCheckingMode = "strict"
extraPaths = ["."]

[[tool.pyright.executionEnvironments]]
root = "gameplay_agent"
typeCheckingMode = "strict"
extraPaths = ["."]

[[tool.pyright.executionEnvironments]]
root = "server"
typeCheckingMode = "strict"
extraPaths = ["."]


# ---------------------------------------------------------------------------
# Coverage (pytest-cov)
# ---------------------------------------------------------------------------
# Default `pytest --cov` to scope to first-party source dirs. Tests
# themselves are excluded from coverage measurement (they're not what
# we're trying to cover).
[tool.coverage.run]
source = [
    "gameplay_agent",
    "autoresearch",
    "evaluation",
    "server",
    "detection",
]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "venv/*",
    "experiments/*",
]
branch = true

[tool.coverage.report]
# Show the missing line numbers — much more actionable than a bare percentage.
show_missing = true
# Skip files with 100% coverage to keep the report focused on gaps.
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
