[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"


# ---------------------------------------------------------------------------
# Project metadata (PEP 621)
# ---------------------------------------------------------------------------
# Single source of truth for dependencies and scripts. Install with:
#   pip install -e .                  # core agent (Mac dev)
#   pip install -e ".[server]"        # also install the detection server
#   pip install -e ".[dev]"           # core + dev tooling (ruff, pytest, ...)
#   pip install -e ".[server,dev]"    # everything for full local work
#   pip install -e ".[coreml]"        # macOS-only CoreML inference
[project]
name = "aoe2-agent"
version = "0.1.0"
description = "AoE2 LLM Arena — gameplay agent + detection server + evaluation framework"
requires-python = ">=3.11"
authors = [{ name = "Marton Dobos" }]
readme = { file = "README.md", content-type = "text/markdown" }

# Core runtime — used by gameplay_agent and indirectly by tests.
# Mirrors gameplay_agent/requirements.txt; the .txt file is kept as a
# convenience alias but `pip install -e .` is the source of truth.
dependencies = [
    "anthropic>=0.84.0",
    "colorama>=0.4.6",
    "duckdb>=1.0.0",
    "httpx>=0.27.0",
    "mss>=9.0.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.17.0",
    "Pillow>=10.0.0",
    "pyautogui>=0.9.54",
    "pydantic>=2.5.0",
    "pygetwindow>=0.0.9",
    "python-multipart>=0.0.7",
    "pyyaml>=6.0",
    "scipy>=1.11.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
dev = [
    "ruff>=0.15.0",
    "pytest>=9.0.0",
    "pytest-cov>=5.0.0",
    # basedpyright = stricter pyright fork; recognizes reportAny /
    # reportExplicitAny (Microsoft's pyright deliberately omits them).
    # Configured under [tool.pyright] — basedpyright reads the same section.
    "basedpyright>=1.39.0",
    "pre-commit>=4.0.0",
]
# macOS-only — install separately when running CoreML inference.
coreml = [
    "coremltools>=8.0",
]
# YOLO training / inference toolchain. Installed on training boxes
# (Windows VM, Linux GPU host) and on any dev machine that runs
# `detection/` scripts. Not part of the core agent runtime, which
# uses ONNX via `onnxruntime` (already in core deps).
detection = [
    "ultralytics>=8.4",
]
# Sliced inference for small-object pre-labeling (`detection/labeling/prelabel.py`
# with `--use-sahi`). Optional; the prelabel CLI falls back to whole-image
# inference when sahi is not installed.
labeling = [
    "sahi>=0.11",
    "ultralytics>=8.4",
]

[project.scripts]
aoe2-agent = "gameplay_agent.main:main"
aoe2-server = "server.app:main"

[tool.setuptools.packages.find]
include = [
    "gameplay_agent*",
    "autoresearch*",
    "evaluation*",
    "server*",
    "detection*",
    "data*",
    "arena*",
]
exclude = ["tests*", "experiments*", "venv*", "memories*", "logs*", "tmp*", "arena.web.ui*"]


# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100

# Skip vendored / scratch / non-source dirs. Ruff's defaults already exclude
# venv, build, dist, etc., but spell out the project-specific ones. Every
# first-party package (gameplay_agent, autoresearch, evaluation, server,
# detection, arena, data) is linted — only scratch dirs and bundled assets
# are skipped.
extend-exclude = [
    "experiments",
    "logs",
    "tmp",
    "memories",
    "game_graphics",
    "arena/web/ui",
]

[tool.ruff.lint]
# Active rule set. Rules that have been baselined and triaged are below;
# deliberately deferred rules + the reason are listed in the comment block
# after `select`.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names)
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade (modern Python idioms)
    "B",   # flake8-bugbear (likely bugs)
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "PTH", # flake8-use-pathlib (prefer Path over os.path/builtin open)
    "DTZ", # flake8-datetimez (require explicit tz on datetime calls)
    "RET", # flake8-return (drop superfluous else-after-return / build-then-return)
    "TCH", # flake8-type-checking (push type-only imports under TYPE_CHECKING)
    "C4",  # flake8-comprehensions (idiomatic comprehensions / dict construction)
    "ANN", # flake8-annotations (require type hints on AI-agent code)
    "PGH", # pygrep-hooks: forbid blanket `# type: ignore` without a code; flag eval/exec usage
]
# Rules audited and intentionally NOT enabled (re-evaluate when the
# corresponding baseline shrinks or a contributor wants to do the cleanup):
#   ANN   — 249 missing-annotation errors. Worth attacking once core
#           modules have full type hints; doing it as a global pass would
#           churn 30+ files for low marginal value.
#   BLE001 — 41 broad `except Exception:` sites, all legitimate boundary
#           catches (anthropic SDK, optional-resource init, harness
#           tolerance). See note in `ignore` below.
#   S     — 348 hits dominated by S101 (267 `assert` in tests; the standard
#           way to write pytest assertions) and S311 (67 random.*; used for
#           game-variety, not crypto). Real signal would be drowned.
#   N     — naming. Several established names (e.g. `_DETECTED_ENTITIES`)
#           would flip on enabling.
#   PL    — pylint-style rules; ~1k findings, mostly stylistic.
ignore = [
    "E501",   # line-too-long: ruff format handles formatting; long literals are fine
    "B008",   # function-call-in-default-argument: common with FastAPI Depends() etc.
    "SIM108", # use ternary: not always more readable
    # ANN401 (`Any` in type annotations) IS enforced. The codebase aims to have
    # zero `Any` annotations. SDK boundaries that genuinely need to escape the
    # type system use `# pyright: ignore[reportArgumentType]` per-line instead
    # of the previous `cast(Any, ...)` pattern.
    # BLE001 (blind-except) deliberately NOT enabled. Audited 2026-05: all 41
    # `except Exception:` sites are legitimate boundary catches (anthropic API
    # calls, optional-resource init, scenario-harness tolerance, file-parser
    # robustness, Tkinter overlay, conftest GUI-import shim). Narrowing them
    # would mean every new exception type from a third-party SDK becomes an
    # unhandled crash. Re-run `ruff check . --select BLE001` for an ad-hoc
    # audit before adding new broad catches.
]

[tool.ruff.lint.per-file-ignores]
# Tests don't need annotations — pytest doesn't care about test return types,
# and `dataclass` test fixtures get annotation-free defaults.
"tests/**" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


# ---------------------------------------------------------------------------
# Pyright — static type checker
# ---------------------------------------------------------------------------
# Covers every first-party python package in the repo. Exclusions are scratch
# / vendored / non-source dirs only — no first-party package is allowed to
# skip type checking. numpy / PIL / ultralytics boundaries are crossed via
# explicit `cast(...)` at the call site, not by excluding the file.
[tool.pyright]
include = [
    "gameplay_agent",
    "autoresearch",
    "evaluation",
    "server",
    "detection",
    "arena",
    "data",
]
exclude = [
    "venv",
    "**/__pycache__",
    "experiments",
    "tmp",
    "logs",
    "memories",
    "arena/web/ui",
]
typeCheckingMode = "basic"
pythonVersion = "3.11"
# Point pyright at the project venv so it can resolve installed third-party
# packages (numpy, ultralytics, coremltools, etc.). Pyright/basedpyright are
# Node tools: they do NOT auto-discover site-packages just because the
# `basedpyright` binary lives inside `venv/bin/`. Without these two keys, every
# third-party import becomes `reportMissingImports`, which then cascades into
# `reportAttributeAccessIssue` for re-exported names (e.g. `YOLO` via
# `detection/_ultralytics_compat.py`). Pre-commit and CI both resolve packages
# from the same `venv/`, so a single setting covers all entry points.
venvPath = "."
venv = "venv"
# Treat third-party packages without stubs as untyped rather than failing.
reportMissingTypeStubs = false
reportMissingImports = "warning"
# Enforce no `Any` annotations and no `cast(Any, ...)` escape hatches.
# SDK boundaries that genuinely need to escape the type system use
# `# pyright: ignore[reportArgumentType]` per-line instead.
reportExplicitAny = "error"
reportAny = "error"

# Per-directory extraPaths via executionEnvironments. Each scoped dir
# needs `.` in its path so basedpyright's resolver can find sibling
# packages (gameplay_agent, autoresearch, evaluation, etc.) without
# strict-checking transitively-imported third-party code.
#
# NOTE: the original intent of these blocks was to enable
# `typeCheckingMode = "strict"` per dir, but that key is unsupported
# inside executionEnvironments by both pyright AND basedpyright —
# the setting was silently inert. The whole repo runs at the base
# `typeCheckingMode = "basic"`. Re-enabling per-dir strict requires
# either explicit `reportXxx` overrides per env, or separate
# pyrightconfig.json files in each dir. Tracked as a follow-up.
[[tool.pyright.executionEnvironments]]
root = "evaluation"
extraPaths = ["."]

[[tool.pyright.executionEnvironments]]
root = "autoresearch"
extraPaths = ["."]

[[tool.pyright.executionEnvironments]]
root = "gameplay_agent"
extraPaths = ["."]

[[tool.pyright.executionEnvironments]]
root = "server"
extraPaths = ["."]

[[tool.pyright.executionEnvironments]]
root = "arena"
extraPaths = ["."]

[[tool.pyright.executionEnvironments]]
root = "detection"
extraPaths = ["."]

[[tool.pyright.executionEnvironments]]
root = "data"
extraPaths = ["."]


# ---------------------------------------------------------------------------
# Coverage (pytest-cov)
# ---------------------------------------------------------------------------
# Default `pytest --cov` to scope to first-party source dirs. Tests
# themselves are excluded from coverage measurement (they're not what
# we're trying to cover).
[tool.coverage.run]
source = [
    "gameplay_agent",
    "autoresearch",
    "evaluation",
    "server",
    "detection",
    "arena",
]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "venv/*",
    "experiments/*",
]
branch = true

[tool.coverage.report]
# Show the missing line numbers — much more actionable than a bare percentage.
show_missing = true
# Skip files with 100% coverage to keep the report focused on gaps.
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
