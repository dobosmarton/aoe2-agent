[tool.ruff]
target-version = "py311"
line-length = 100

# Skip vendored / data / non-source dirs. Ruff's defaults already exclude
# venv, build, dist, etc., but spell out the project-specific ones.
extend-exclude = [
    "experiments",
    "data",
    "logs",
    "tmp",
    "memories",
    "game_graphics",
]

[tool.ruff.lint]
# Conservative starter set. Add more (PL, ANN, S, ...) once the baseline is clean.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names)
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade (modern Python idioms)
    "B",   # flake8-bugbear (likely bugs)
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line-too-long: ruff format handles formatting; long literals are fine
    "B008",   # function-call-in-default-argument: common with FastAPI Depends() etc.
    "SIM108", # use ternary: not always more readable
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "E402",  # module-level import not at top: tests sometimes set sys.path first
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


# ---------------------------------------------------------------------------
# Pyright — static type checker
# ---------------------------------------------------------------------------
# Scoped to the AI agent code. detection/ is computer-vision/ML and uses
# numpy/PIL shapes that grumble loudly under static checking; revisit later.
[tool.pyright]
include = [
    "gameplay_agent",
    "autoresearch",
    "evaluation",
    "server",
]
exclude = [
    "venv",
    "**/__pycache__",
    "experiments",
    "tmp",
    "logs",
    "memories",
    "data",
]
# Point pyright at the project venv so third-party imports (anthropic,
# structlog, mss, ...) resolve. Without this, pre-commit's pyright runs
# in a sandboxed env without our deps and floods the report with bogus
# "Import could not be resolved" errors.
venvPath = "."
venv = "venv"
typeCheckingMode = "basic"
pythonVersion = "3.11"
# Treat third-party packages without stubs as untyped rather than failing.
reportMissingTypeStubs = false
reportMissingImports = "warning"


# ---------------------------------------------------------------------------
# Coverage (pytest-cov)
# ---------------------------------------------------------------------------
# Default `pytest --cov` to scope to first-party source dirs. Tests
# themselves are excluded from coverage measurement (they're not what
# we're trying to cover).
[tool.coverage.run]
source = [
    "gameplay_agent",
    "autoresearch",
    "evaluation",
    "server",
    "detection",
]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "venv/*",
    "experiments/*",
]
branch = true

[tool.coverage.report]
# Show the missing line numbers — much more actionable than a bare percentage.
show_missing = true
# Skip files with 100% coverage to keep the report focused on gaps.
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
